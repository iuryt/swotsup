[project]
authors = [{name = "iury Simoes-Sousa", email = "iuryt@pm.me"}]
name = "whereisswot"
requires-python = ">= 3.11"
version = "3.0.1"
license = "MIT"
description = "Web app to visualize and track SWOT satellite passings, and the SWOT data themselves."

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
icechunk = ">=1.1.21,<2"
xarray = ">=2026.2.0,<2027"
zarr = ">=3,<4"
numpy = ">=2"
pandas = "*"
h5netcdf = ">=1.8.1,<2"
datashader = "*"
matplotlib = "*"
cartopy = ">=0.25.0,<0.26"
pillow = "*"
fastapi = "*"
uvicorn = "*"
httpx = "*"  # fastapi's TestClient
pytest = "*"

[tool.pixi.pypi-dependencies]
playwright = "*"  # screenshots of the app in a headless browser (scripts/screenshot.py)
swot_icechunk = { path = "../swot_icechunk", editable = true }  # tests build small stores with it

[tool.pixi.tasks]
test = "pytest -q tests"
serve = "uvicorn server:app --app-dir app --port 5006"

# the current Where is SWOT? (Flask + Folium), until the explorer replaces it: pixi run -e legacy start
[tool.pixi.feature.legacy.dependencies]
flask = ">=3.0.3,<4"
folium = ">=0.17.0,<0.18"
geopandas = ">=1.0.1,<2"
gunicorn = ">=23.0.0,<24"
pandas = ">=2.2.3,<3"
numpy = ">=2.0.2,<3"
matplotlib = ">=3.9.2,<4"
mapclassify = ">=2.8.1,<3"
shapely = ">=2.0.6,<3"
pyproj = ">=3.6.1,<4"

[tool.pixi.feature.legacy.tasks]
start = "python app.py"

[tool.pixi.environments]
legacy = { features = ["legacy"], no-default-feature = true }

[tool.pytest.ini_options]
pythonpath = ["app"]
