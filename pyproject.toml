[project]
authors = [{name = "iury Simoes-Sousa", email = "iuryt@pm.me"}]
name = "swot-explorer"
requires-python = ">= 3.11"
version = "0.19.0"
license = "MIT"
description = "SWOT Sea Surface Height Explorer: a web map over the SWOT L3 LR SSH IceChunk store."

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
icechunk = ">=2.3,<3"  # format v2 (the Arraylake store)
arraylake = ">=1.7"  # Earthmover: the client vends the storage credentials
xarray = ">=2026.2.0,<2027"
zarr = ">=3,<4"
numpy = ">=2"
pandas = "*"
h5netcdf = ">=1.8.1,<2"
datashader = "*"
scipy = "*"  # nearest pixels along a drawn line
matplotlib-base = "*"  # no Qt: the server draws to files only
cmocean = "*"  # the oceanographic colormaps (sigma0, SWH, wind)
cartopy = ">=0.25.0,<0.26"
pillow = "*"
fastapi = "*"
uvicorn = "*"

[tool.pixi.pypi-dependencies]
maxminddb = "*"  # the country of a visitor, from DB-IP Lite (anonymous usage)
pcodec = "*"  # the L2 stores' numbers (numcodecs.zarr3.PCodec); on PyPI only

# tests and screenshots; the server alone is the environment `serve` (what the Docker image installs)
[tool.pixi.feature.dev.dependencies]
httpx = "*"  # fastapi's TestClient
pytest = "*"

[tool.pixi.feature.dev.pypi-dependencies]
playwright = "*"  # screenshots of the app in a headless browser (scripts/screenshot.py)
swot_cloud = { path = "../swot_cloud", editable = true }  # tests build small stores with it

[tool.pixi.tasks]
test = "pytest -q tests"
serve = "uvicorn server:app --app-dir app --port 5006"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "app" }
serve = { features = [], solve-group = "app" }  # same versions as default, so the server runs what we test

[tool.pytest.ini_options]
pythonpath = ["app"]
